# Render Blueprint Specification for Healthcare Decision Support System (Healthcare MDSS)
# Optimized for Render Free Tier (512MB RAM)

services:
  - type: web
    name: healthcare-dss
    env: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    # Single worker with 4 lightweight threads (gthread) preserves memory within the 512MB free tier budget
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --worker-class gthread --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /accounts/login/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: CHROMA_DB_PATH
        value: ./chroma_db
      
      # Firebase Cloud Storage configuration for persistent media (X-rays, MRIs, PDFs)
      - key: USE_FIREBASE_STORAGE
        value: "True"
      - key: GS_BUCKET_NAME
        sync: false
      - key: GS_PROJECT_ID
        sync: false
      - key: GS_CREDENTIALS_PATH
        sync: false

      # Optional Render PostgreSQL integration:
      # If using Render's free PostgreSQL database, link it here:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: healthcare-db
      #     property: connectionString

# databases:
#   - name: healthcare-db
#     plan: free
